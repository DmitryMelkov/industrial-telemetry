<div class="login">
  <div class="login__backdrop">
    <app-theme-toggle class="login__theme-toggle" variant="toolbar" />

    <div class="login__card surface-card">
      <div class="login__header">
        <h1 class="typo typo--h2">Авторизация</h1>
        <div class="page-accent"></div>
      </div>

      <form class="login__form" [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <mat-icon matPrefix>person</mat-icon>
          <input matInput type="email" formControlName="email" autocomplete="username" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Пароль</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
        </mat-form-field>

        @if (errorMessage()) {
          <p class="typo typo--error login__error" role="alert">{{ errorMessage() }}</p>
        }

        <button
          mat-flat-button
          class="btn btn--primary login__submit"
          type="submit"
          disableRipple
          [disabled]="form.invalid || isSubmitting()"
        >
          <mat-icon>login</mat-icon>
          {{ isSubmitting() ? 'Вход…' : 'Войти' }}
        </button>
      </form>
    </div>
  </div>
</div>
